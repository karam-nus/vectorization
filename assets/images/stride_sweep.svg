<svg xmlns="http://www.w3.org/2000/svg" width="800" height="420" viewBox="0 0 800 420" role="img" aria-labelledby="t d">
<title id="t">Cost per element versus access stride</title><desc id="d">Three nearly identical lines rising from about 0.3 ns at stride 1 to about 8 ns at stride 32: the number of cache lines touched, not the instruction set, sets the cost.</desc>
<rect width="800" height="420" rx="10" fill="#111111"/>
<text x="24.0" y="32.0" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" fill="#e8e8e8" text-anchor="start" font-weight="600" >Stride decides the cost; the vector width does not</text>
<text x="24.0" y="52.0" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#6b6b6b" text-anchor="start" font-weight="400" >y[i] = 2·x[i·s], fp32, 1 M outputs, ns per useful element (log scale) · Xeon (Emerald Rapids), 1 core, gcc 13.3</text>
<line x1="80.0" y1="350.0" x2="700.0" y2="350.0" stroke="#262626" stroke-width="1"/>
<text x="72.0" y="354.0" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="#6b6b6b" text-anchor="end" font-weight="400" >0.2</text>
<line x1="80.0" y1="299.5" x2="700.0" y2="299.5" stroke="#262626" stroke-width="1"/>
