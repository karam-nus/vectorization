<text x="390.0" y="386.0" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="#6b6b6b" text-anchor="middle" font-weight="400" >stride s (elements)</text>
<line x1="80.0" y1="350.0" x2="700.0" y2="350.0" stroke="#3a3a3a" stroke-width="1"/>
<line x1="576.0" y1="96.0" x2="576.0" y2="350.0" stroke="#4a4a4a" stroke-width="1"/>
<text x="570.0" y="108.0" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="#a3a3a3" text-anchor="end" font-weight="400" >s = 16: one 64-byte line</text>
<text x="570.0" y="123.0" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="#a3a3a3" text-anchor="end" font-weight="400" >per element (4 of 64 B used)</text>
