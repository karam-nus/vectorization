<line x1="80.0" y1="261.2" x2="700.0" y2="261.2" stroke="#262626" stroke-width="1"/>
<text x="72.0" y="265.2" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="#6b6b6b" text-anchor="end" font-weight="400" >1</text>
<line x1="80.0" y1="223.0" x2="700.0" y2="223.0" stroke="#262626" stroke-width="1"/>
