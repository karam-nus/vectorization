title: "Vectorization — The Complete Guide"
description: "From one lane to ten thousand: how computation is reshaped to run many-at-once, in NumPy, in compilers, in CUDA kernels and in silicon, and how to see it before you write it."
baseurl: "/vectorization"
url: "https://karam-nus.github.io"

markdown: kramdown
highlighter: rouge

kramdown:
  input: GFM
  hard_wrap: false
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    css_class: "highlight"
    span:
      line_numbers: false
    block:
      line_numbers: true

plugins:
  - jekyll-relative-links

relative_links:
  enabled: true
  collections: false

include:
  - README.md

exclude:
  - code/
  - tools/
  - Gemfile
  - Gemfile.lock
  - vendor/

